<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军训第二夜有感，8/18又记</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }
        .wrap {
            max-width: 860px;
            margin: 0 auto;
        }
        .back-box {
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            background: linear-gradient(135deg, #4b6cb7, #182848);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 5px 14px rgba(75, 108, 183, 0.3);
            transition: all 0.3s;
        }
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(75, 108, 183, 0.42);
        }
        .article-card {
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            padding: 45px 40px;
        }
        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #4b6cb7, #182848);
        }
        .article-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .article-header h1 {
            font-size: 2.4rem;
            color: #182848;
            margin-bottom: 15px;
        }
        .divider {
            width: 140px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #4b6cb7, transparent);
            margin: 0 auto 18px;
        }
        .article-meta {
            font-size: 1rem;
            color: #666;
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .article-meta span i {
            color: #4b6cb7;
            margin-right: 6px;
        }
        .article-body {
            font-size: 1.15rem;
            line-height: 1.85;
            color: #3a3a3a;
        }
        .article-body p {
            margin-bottom: 22px;
            text-indent: 2em;
        }
        .article-body .short-start {
            text-indent: 0;
            font-size: 1.25rem;
            color: #182848;
            font-weight: 500;
        }
        footer {
            text-align: center;
            color: #777;
            font-size: 0.98rem;
            padding-top: 30px;
            margin-top: 40px;
            border-top: 1px dashed #ccc;
        }
        .modify-time {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #888;
        }
        @media (max-width:768px) {
            .article-card {
                padding: 32px 22px;
            }
            .article-header h1 {
                font-size: 2rem;
            }
            .article-body {
                font-size: 1.08rem;
            }
        }
        @media (max-width:480px) {
            .article-header h1 {
                font-size: 1.7rem;
            }
            .article-meta {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="back-box">
            <a href="https://hans.xinchen-gh2.com/word" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回文章随笔列表
            </a>
        </div>
        <div class="article-card">
            <div class="article-header">
                <h1><i class="fas fa-gem"></i> 军训第二夜有感，8/18又记</h1>
                <div class="divider"></div>
                <div class="article-meta">
                    <span><i class="fas fa-tag"></i>感悟</span>
                    <!--<span><i class="fas fa-mountain-sun"></i>盐湖纪实</span>-->
                </div>
            </div>
            <div class="article-body">
                <p>暗夜，起笔，庞无一人，空孤寂。</p>
                <p>往事幻化云烟。</p>
                <p>无人记忆。</p>
                <p>真，随风离去吗？</p>
                <p>记忆里，她的样子，散落一地，扎着心疼，无从下手，鲜血里，拼不出模样。</p>
                <p>散场了。</p>
                <p>真的散了，一张张面孔，液晶屏里也未再窥见。</p>
                <p>忆往昔，小学时光，洋洋洒洒，只作滩涂废墟。</p>
                <p>忆往昔，初中时光，四季轮回，暴雨倾盆，作时间长河点滴。</p>
                <p>一切都走了。</p>
                <p>真的，</p>
                <p>没了。</p>
            </div>
        </div>
        <footer>
            <p>© 2026 √2工作室/Hans 版权所有</p>
            <p class="modify-time">页面最后修改时间：2026年10月05日</p>
        </footer>
    </div>
</body>
</html>
