<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | 建设中</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 850px;
            width: 100%;
            text-align: center;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #4b6cb7, #182848);
        }
        
        .construction-icon {
            font-size: 5rem;
            color: #4b6cb7;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .message {
            font-size: 2.8rem;
            font-weight: 700;
            color: #182848;
            line-height: 1.3;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }
        
        .divider {
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #4b6cb7, transparent);
            margin: 0 auto 30px;
        }
        
        .sub-message {
            font-size: 1.4rem;
            color: #666;
            max-width: 650px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .intro-box {
            background: rgba(75, 108, 183, 0.08);
            border-radius: 14px;
            padding: 24px;
            margin: 0 auto 40px;
            max-width: 700px;
        }
        .intro-title {
            font-size: 1.3rem;
            color: #182848;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .intro-text {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.7;
        }
        
        .progress-container {
            width: 100%;
            max-width: 550px;
            margin: 0 auto 50px;
            text-align: left;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #555;
        }
        
        .progress-bar {
            height: 12px;
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #4b6cb7, #182848);
            border-radius: 10px;
            animation: progress-animation 2s ease-in-out infinite alternate;
        }
        
        @keyframes progress-animation {
            0% { width: 70%; }
            100% { width: 80%; }
        }
        
        /* 按钮组样式 */
        .button-group {
            margin: 30px auto;
            max-width: 520px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
        }
        
        .main-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(75, 108, 183, 0.4);
            flex: 1;
            min-width: 220px;
            max-width: 320px;
        }
        
        .main-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(75, 108, 183, 0.6);
            background: linear-gradient(135deg, #5a7bc9 0%, #213a70 100%);
        }
        
        .main-btn:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(75, 108, 183, 0.4);
        }
        
        .main-btn i {
            margin-right: 10px;
            font-size: 1.4rem;
        }

        .universe-btn {
            background: linear-gradient(135deg, #6c5ce7 0%, #2d3436 100%);
        }
        .universe-btn:hover {
            background: linear-gradient(135deg, #81ecec 0%, #000000 100%);
        }
        
        .contact-info {
            font-size: 1.2rem;
            color: #555;
            padding-top: 25px;
            border-top: 1px dashed #ccc;
            margin-top: 20px;
        }
        
        .contact-info p {
            margin: 10px 0;
        }
        .contact-info i {
            color: #4b6cb7;
            margin-right: 8px;
        }
        
        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 1rem;
            text-align: center;
        }
        .modify-time {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #888;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            .construction-icon {
                font-size: 4rem;
            }
            
            .message {
                font-size: 2.2rem;
            }
            
            .sub-message {
                font-size: 1.2rem;
            }
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            .main-btn {
                width: 100%;
                max-width: 350px;
            }
        }
        
        @media (max-width: 480px) {
            .construction-icon {
                font-size: 3.5rem;
            }
            
            .message {
                font-size: 1.8rem;
            }
            
            .sub-message {
                font-size: 1.1rem;
            }
            
            .contact-info {
                font-size: 1rem;
            }
            
            .main-btn {
                padding: 12px 24px;
                font-size: 1rem;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="construction-icon">
            <i class="fas fa-code"></i>
        </div>
        
        <h1 class="message">个人主页正在搭建，敬请期待</h1>
        
        <div class="divider"></div>
        
        <p class="sub-message">兼顾学业与创作，站点持续优化完善中，文章、随笔、项目记录会陆续上线，感谢耐心等候！</p>

        <!-- 个人简介模块 -->
        <div class="intro-box">
            <h3 class="intro-title"><i class="fas fa-user-circle"></i> 关于我</h3>
            <p class="intro-text">热爱编程、文字创作与脑洞幻想，会在这里记录学习笔记、生活随笔、原创短文与开发项目；打造专属的「大欣宇宙」幻想世界观，分享故事与设定。</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-label">
                <span>站点建设进度</span>
                <span>75%</span>
            </div>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
        
        <!-- 按钮组：文章入口 + 大欣宇宙 -->
        <div class="button-group">
            <a href="https://hans.xinchen-gh2.com/word" class="main-btn" target="_blank">
                <i class="fas fa-book-open"></i>
                文章随笔入口
            </a>
            <a href="https://dxu.xinchen-gh2.com" class="main-btn universe-btn" target="_blank">
                <i class="fas fa-globe-asia"></i>
                通往「大欣宇宙」
            </a>
        </div>
        
        <div class="contact-info">
            <p><i class="fas fa-envelope"></i>联系邮箱：2584013851@qq.com</p>
            <p><i class="fas fa-link"></i>工作室站点：<a href="https://xinchen-gh2.com" style="color:#4b6cb7;text-decoration:none;">√2工作室官网</a></p>
        </div>
    </div>
    
    <div class="footer">
        <p>© 2026 √2工作室/Hans 版权所有</p>
        <p class="modify-time">页面最后修改时间：2026年08月09日</p>
    </div>

    <script>
        // 页面加载动画逻辑
        document.addEventListener('DOMContentLoaded', function() {
            const message = document.querySelector('.message');
            const originalText = message.textContent;
            
            // 打字机标题效果
            let charIndex = 0;
            message.textContent = '';
            function typeWriter() {
                if (charIndex < originalText.length) {
                    message.textContent += originalText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 80);
                }
            }
            setTimeout(typeWriter, 500);
            
            // 进度数字滚动动画
            const progressPercent = document.querySelector('.progress-label span:last-child');
            let percent = 0;
            const targetPercent = 75;
            const progressInterval = setInterval(() => {
                if (percent < targetPercent) {
                    percent += 1;
                    progressPercent.textContent = percent + '%';
                } else {
                    clearInterval(progressInterval);
                }
            }, 30);
            
            // 所有按钮hover增强缩放动画
            const allBtns = document.querySelectorAll('.main-btn');
            allBtns.forEach(btn => {
                btn.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-3px) scale(1.02)';
                });
                btn.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
        });
    </script>
</body>
</html>
